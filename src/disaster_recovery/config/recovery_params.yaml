recovery_controller:
  ros__parameters:
    heartbeat_timeout_sec: 3.0
    gas_threshold: 0.40            # gas_sensor_node danger metric (1 - Rs/Rs_air), not ppm
    gas_stale_timeout_sec: 2.0     # warn if /gas/level stops arriving
    gas_stale_triggers_recovery: false
    log_dist_threshold_m: 0.30
    log_angle_threshold_deg: 25.0
    waypoint_reach_radius_m: 0.10
    heading_tolerance_rad: 0.12
    linear_speed_max: 0.20        # Upgraded to 0.20 m/s for smooth continuous tracking
    angular_speed_max: 0.65       # Upgraded to 0.65 rad/s for responsive cornering
    kp_linear: 0.60
    kp_angular: 1.40
    lidar_min_range_m: 0.12
    lidar_max_danger_range_m: 0.25
    lidar_fov_half_deg: 20.0
    docking_start_distance_m: 0.50
    enable_scan_matching: true        # 2D LiDAR Scan Matching odometry drift compensation
    scan_match_weight: 0.40           # Complementary filter fusion weight (0.0=pure odom, 1.0=pure lidar)
    scan_match_max_dist_m: 0.45       # Max distance to WP to trigger ICP matching
    use_aruco_docking: false          # Complete mission directly upon base camp arrival
    aruco_docking_timeout_sec: 12.0   # Backup timeout to force MISSION_COMPLETE if docking stalls

    # Next-Gen Layer 2: Continuous Regulated Pure Pursuit + Residual RL (TD3)
    enable_hybrid_tracking: true      # Continuous Pure Pursuit + Residual RL hybrid tracking
    lookahead_dist_m: 0.45            # Pure pursuit lookahead distance (m)
    enable_td3_avoidance: true        # TD3 neural local reactive avoidance & barrier
    td3_model_path: ""                # Auto-resolve from package share/config unless explicitly overridden
    td3_clearance_dist_m: 0.42        # Obstacle bypass clearance threshold
    td3_max_avoid_steps: 250          # 25s avoidance timeout at 10Hz before advancing WP
    context_rl_onnx_path: ""          # Auto-resolve sim_policy_student.onnx when recovery_strategy=proposed_rl

gas_sensor_node:
  ros__parameters:
    i2c_bus: 1
    i2c_address: 72                # 0x48 (ADS1115 ADDR -> GND)
    adc_channel: 0                 # AIN0
    adc_fsr_v: 4.096               # PGA +/-4.096 V (input still limited to VDD = 3.3 V)
    sample_rate_hz: 20.0
    ema_alpha: 0.15
    divider_r1_kohm: 10.0          # series (AOUT -> AIN0)
    divider_r2_kohm: 20.0          # AIN0 -> GND
    sensor_vcc: 5.0
    load_resistor_kohm: 10.0       # MQ-2 module RL (only affects absolute Rs, not the metric)
    warmup_sec: 60.0               # heater warm-up before baseline
    baseline_samples: 100          # 5 s at 20 Hz, in clean air
    rs_air_kohm: 0.0               # >0 reuses a stored baseline and skips measurement
    max_consecutive_errors: 10

aruco_docking:
  ros__parameters:
    marker_id: 0
    marker_size_m: 0.10
    target_dock_dist_m: 0.20
    dist_tolerance_m: 0.02
    lateral_tolerance_m: 0.02
    yaw_tolerance_rad: 0.05
    kp_linear: 0.40
    kp_lateral: 1.20
    kp_yaw: 0.80
    max_linear_speed: 0.08
    max_angular_speed: 0.35
    search_angular_speed: 0.20
    search_timeout_sec: 10.0          # Stop search and complete mission after 10s if marker absent
    camera_rotation_deg: 270       # Pi camera mounted sideways (same as host rotation_angle)

audio_capture_node:
  ros__parameters:
    alsa_device: "plughw:1,0"      # Generic AB13X USB Audio (check with: arecord -l)
    sample_rate: 48000             # native rate of the AB13X mic (S16_LE, mono)
    channels: 1
    chunk_duration_sec: 0.5        # 48,000 B per /audio/raw message
    audio_topic: "/audio/raw"
